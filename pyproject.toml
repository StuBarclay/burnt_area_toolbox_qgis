[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "burnt-area-toolbox-qgis"
version = "0.1.0"
description = "QGIS plugin: Sentinel-2 dNBR burnt-area and burn-severity mapping"
readme = "README.md"
# The vendored compute core uses ``@dataclass(slots=True)`` and the
# ``X | Y`` union syntax in annotations -- both are fine at runtime on
# Python 3.10+, which is the floor modern QGIS ships (3.28+/3.34 LTR).
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Stuart Barclay" }]
keywords = ["bushfire", "burnt area", "dNBR", "NBR", "sentinel-2", "GIS", "raster", "qgis", "processing"]
# No runtime dependencies: the plugin uses only numpy and GDAL/OGR/OSR,
# both of which ship inside QGIS. The vendored ``bacore._rio`` package
# rewrites all rasterio/fiona I/O against ``osgeo`` so nothing extra is
# ever installed by the user.
dependencies = []

[project.optional-dependencies]
# Development / CI only. rasterio + affine are used solely to test that the
# vendored ``_rio`` GDAL shim behaves identically to real rasterio; they are
# never imported by the plugin at runtime.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy==1.11.2",
    "types-PyYAML>=6.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "rasterio>=1.4,<1.5",
    "affine>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["burnt_area_toolbox"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["burnt_area_toolbox", "tests"]
# The vendored GDAL shim (``bacore/_rio``) mirrors the rasterio/fiona API;
# only its import lines were rewritten to sit inside this package. That
# mechanical rewrite is the sole source of style drift, so lint the code we
# author -- not the vendored shim. mypy still type-checks all of it.
extend-exclude = ["burnt_area_toolbox/bacore/_rio"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The QGIS plugin API mandates camelCase method and argument names
# (initAlgorithm, processAlgorithm, displayName, ...). These overrides
# cannot be renamed, so exempt the QGIS-facing glue from pep8-naming; the
# vendored core and pure compute core are unaffected.
"burnt_area_toolbox/plugin.py" = ["N802"]
"burnt_area_toolbox/provider.py" = ["N802"]
"burnt_area_toolbox/algorithms/*.py" = ["N802", "N803"]
"burnt_area_toolbox/gui/*.py" = ["N802", "N803"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["burnt_area_toolbox", "tests"]
explicit_package_bases = true
[[tool.mypy.overrides]]
module = ["rasterio.*", "scipy.*", "fiona.*", "affine.*", "osgeo.*", "qgis.*", "processing.*"]
ignore_missing_imports = true
# QGIS ships no type stubs, so its Python API resolves to ``Any`` in CI. The
# qgis-facing glue must subclass those ``Any`` base classes and implement
# QGIS-mandated override signatures that strict mode cannot satisfy. Relax
# only those structurally-impossible rules for the glue -- real bugs are
# still caught, and the pure compute core (bacore + the GDAL shims) stays
# fully strict.
[[tool.mypy.overrides]]
module = [
    "burnt_area_toolbox",
    "burnt_area_toolbox.plugin",
    "burnt_area_toolbox.provider",
    "burnt_area_toolbox.algorithms.*",
    "burnt_area_toolbox.gui.*",
]
disallow_subclassing_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
