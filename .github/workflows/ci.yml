name: CI

# Runs the same four gates the project uses locally: Ruff lint, Ruff format
# check, mypy (strict) and pytest. QGIS is not available on the hosted
# runners, so the QGIS-side tests (tests/test_qgis_glue.py) and the GDAL-backed
# raster tests skip automatically via ``pytest.importorskip`` -- exactly as
# they do in a plain (non-QGIS) environment. The pure compute core, the GDAL
# shims' numeric logic, the config builder, the progress/feedback glue, the
# styling tables and the help metadata are all exercised here.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the compute core's floor (dataclass slots, zip(strict=)).
        # 3.12 is what current QGIS LTR bundles.
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy

      - name: pytest
        run: pytest -q
